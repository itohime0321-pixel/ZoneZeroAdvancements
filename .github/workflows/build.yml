name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle clean build --stacktrace
      - name: NeoForge dedicated-server smoke test
        timeout-minutes: 10
        run: python tools/smoke_server.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZoneZeroAdvancements-Test
          path: |
            build/libs/*.jar
            build/distributions/ZoneZeroAdvancements-Icons.zip
          if-no-files-found: error
