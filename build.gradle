plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}
group = 'zonezero'
version = '0.2.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.172'
    runs {
        smokeServer {
            server()
            gameDirectory = project.file(providers.gradleProperty('zzSmokeDir').orElse('build/smoke-server').get())
            programArgument('--nogui')
            jvmArgument('-Xmx2G')
            jvmArgument('-Dzonezero.verifyConcreteHook=true')
        }
    }
    mods {
        zonezero_advancements { sourceSet sourceSets.main }
    }
}
def python = providers.environmentVariable('PYTHON').orElse('python')
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/advancements'))
tasks.register('generateAdvancements', Exec) {
    inputs.files('tools/generate_advancements.py', 'design/milestones.json', 'design/hidden.json', 'art/icon_manifest.json')
    outputs.dir(layout.buildDirectory.dir('generated/advancements'))
    commandLine python.get(), 'tools/generate_advancements.py'
}
tasks.named('processResources') { dependsOn 'generateAdvancements' }
tasks.register('buildIconPack', Exec) {
    inputs.files('tools/build_resource_pack.py', 'art/icon_manifest.json')
    inputs.dir('art/icons')
    outputs.file(layout.buildDirectory.file('distributions/ZoneZeroAdvancements-Icons.zip'))
    commandLine python.get(), 'tools/build_resource_pack.py'
}
tasks.register('validateAdvancements', Exec) {
    dependsOn 'generateAdvancements', 'buildIconPack'
    commandLine python.get(), 'tools/validate_advancements.py'
}
tasks.named('check') { dependsOn 'validateAdvancements' }
tasks.named('assemble') { dependsOn 'buildIconPack' }

tasks.register('verifyZoneRules', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'zonezero.advancements.ZoneRulesTest'
}
tasks.named('check') { dependsOn 'verifyZoneRules' }
